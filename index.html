<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recetas | Sabores Caseros</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
</head>

<body>

    <header class="header">
        <h1>🍽 Recetas</h1>
        <p>Elegí una categoría y empezá a cocinar</p>
    </header>

    <main class="main">

        <section id="contenedor-main" class="grid-categorias">

            <article class="card">
                <button class="btn-categoria" id="Pasteleria">Pastelería</button>
                <div class="imagen imagen-pasteleria"></div>
            </article>

            <article class="card">
                <button class="btn-categoria" id="Pastas">Pastas</button>
                <div class="imagen imagen-pastas"></div>
            </article>

            <article class="card">
                <button class="btn-categoria" id="Sandwicheria">Sandwichería</button>
                <div class="imagen imagen-sandwicheria"></div>
            </article>

            <article class="card">
                <button class="btn-categoria" id="Flanes">Flanes & Postres</button>
                <div class="imagen imagen-flanes"></div>
            </article>

            <article class="card">
                <button class="btn-categoria" id="AgregarProducto">Agregar Producto</button>
                <div class="imagen imagen-agregar">➕</div>
            </article>

        </section>

    </main>

    <footer class="footer">
        <p>© 2026 Recetas - FoodService s.a</p>
    </footer>

    <script type="module" src="./js/index.js"></script>
</body>

</html>
